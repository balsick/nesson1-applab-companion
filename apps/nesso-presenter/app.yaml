name: Nesso Presenter
description: Drive a slide deck from an Arduino Nesso N1 - buttons to change slide, tilt to point, with the remote's battery and link state on screen.
icon: 🎞️
ports:
  - 8077
bricks:
  - arduino:web_ui: {}
  - nesso_companion:
      variables:
        NESSO_PORT: "8077"
        NESSO_NAME: "Nesso Presenter"
        # You glance at the remote between slides rather than continuously, so
        # give it longer than the 60 s default before the screen blanks.
        NESSO_SCREEN_IDLE_S: "120"

  <rect x="34" y="92" width="46" height="30" rx="4" fill="#0c1416" stroke="#22383d"/>
  <circle cx="120" cy="107" r="11" fill="#0c1416" stroke="#22383d"/>
  <circle cx="120" cy="107" r="4" fill="#00979d"/>

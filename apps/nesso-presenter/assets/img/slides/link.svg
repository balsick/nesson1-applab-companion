  <rect x="288" y="64" width="62" height="104" rx="6" fill="#0c1416" stroke="#22383d"/>
  <g fill="#37d6e0" opacity=".85"><rect x="296" y="74" width="30" height="5" rx="2.5"/></g>
  <g fill="#22383d"><rect x="296" y="88" width="46" height="4" rx="2"/><rect x="296" y="98" width="34" height="4" rx="2"/></g>
  <rect x="296" y="118" width="46" height="16" rx="8" fill="#00979d" opacity=".5"/>
  <circle cx="295" cy="182" r="5" fill="#22383d"/><circle cx="343" cy="182" r="5" fill="#22383d"/>
  <text x="319" y="222" text-anchor="middle" fill="#7d9ea4" font-family="system-ui,sans-serif" font-size="14">Nesso N1</text>

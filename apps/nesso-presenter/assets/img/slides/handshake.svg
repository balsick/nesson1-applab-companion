<svg viewBox="0 0 420 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The board sends a config frame; only the requested sensors wake up">
  <rect x="10" y="56" width="150" height="128" rx="10" fill="#132023" stroke="#22383d" stroke-width="2"/>
  <text x="85" y="84" text-anchor="middle" fill="#37d6e0" font-family="ui-monospace,monospace" font-size="13">config</text>
  <g font-family="ui-monospace,monospace" font-size="11.5" fill="#7d9ea4">
    <text x="30" y="108">pitch  25Hz</text>
    <text x="30" y="128">roll   25Hz</text>
    <text x="30" y="148">battery 1Hz</text>
  </g>
  <rect x="26" y="96" width="118" height="60" rx="6" fill="none" stroke="#22383d" stroke-dasharray="3 4"/>

  <path d="M170 120h72" stroke="#37d6e0" stroke-width="2.5" stroke-linecap="round" marker-end="url(#b)"/>
  <defs><marker id="b" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0 0l7 4.5L0 9z" fill="#37d6e0"/></marker></defs>

  <g font-family="system-ui,sans-serif" font-size="13.5">
    <g><circle cx="272" cy="70" r="8" fill="#4cc38a"/><text x="292" y="75" fill="#e6f1f2">pitch</text></g>
    <g><circle cx="272" cy="106" r="8" fill="#4cc38a"/><text x="292" y="111" fill="#e6f1f2">roll</text></g>
    <g><circle cx="272" cy="142" r="8" fill="#4cc38a"/><text x="292" y="147" fill="#e6f1f2">battery</text></g>
    <g opacity=".4">
      <circle cx="272" cy="178" r="8" fill="none" stroke="#22383d" stroke-width="2"/>
      <text x="292" y="183" fill="#7d9ea4">gyroscope</text>
      <text x="382" y="183" fill="#22383d" font-size="12">zzz</text>
    </g>
    <g opacity=".4">
      <circle cx="272" cy="212" r="8" fill="none" stroke="#22383d" stroke-width="2"/>
      <text x="292" y="217" fill="#7d9ea4">Modulinos</text>
      <text x="382" y="217" fill="#22383d" font-size="12">zzz</text>
    </g>

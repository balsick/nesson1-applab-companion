<svg viewBox="0 0 420 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A Modulino plugged into the Qwiic connector is picked up automatically">
  <rect x="18" y="72" width="92" height="106" rx="12" fill="#132023" stroke="#22383d" stroke-width="2"/>
  <rect x="30" y="84" width="68" height="72" rx="5" fill="#0c1416" stroke="#22383d"/>
  <text x="64" y="200" text-anchor="middle" fill="#7d9ea4" font-family="system-ui,sans-serif" font-size="13">Nesso</text>

  <!-- qwiic cable -->
  <path d="M110 125h44" stroke="#00979d" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="154" y="112" width="12" height="26" rx="3" fill="#00979d"/>

  <!-- the module, just arrived -->
  <rect x="176" y="86" width="96" height="80" rx="10" fill="#132023" stroke="#4cc38a" stroke-width="2"/>
  <g>
    <circle cx="196" cy="112" r="6" fill="#e8595b"/><circle cx="214" cy="112" r="6" fill="#e8a33d"/>
    <circle cx="232" cy="112" r="6" fill="#4cc38a"/><circle cx="250" cy="112" r="6" fill="#37d6e0"/>
  </g>
  <text x="224" y="146" text-anchor="middle" fill="#e6f1f2" font-family="system-ui,sans-serif" font-size="13">Pixels</text>

  <!-- picked up -->
  <path d="M288 126h34" stroke="#4cc38a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#d)"/>
  <defs><marker id="d" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0 0l7 4.5L0 9z" fill="#4cc38a"/></marker></defs>
  <g>
    <circle cx="350" cy="126" r="17" fill="none" stroke="#4cc38a" stroke-width="2"/>
    <path d="M342 126l6 6 12-13" fill="none" stroke="#4cc38a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="350" y="172" text-anchor="middle" fill="#4cc38a" font-family="system-ui,sans-serif" font-size="13">3 seconds</text>
</svg>

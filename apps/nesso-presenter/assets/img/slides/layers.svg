<svg viewBox="0 0 420 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two Apps sharing one brick and one firmware">
  <g font-family="system-ui,sans-serif">
    <rect x="24" y="24" width="160" height="56" rx="9" fill="#132023" stroke="#37d6e0" stroke-width="2"/>
    <text x="104" y="48" text-anchor="middle" fill="#e6f1f2" font-size="14">Presenter App</text>
    <text x="104" y="66" text-anchor="middle" fill="#7d9ea4" font-size="11.5">4 values</text>

    <rect x="236" y="24" width="160" height="56" rx="9" fill="#132023" stroke="#22383d" stroke-width="2"/>
    <text x="316" y="48" text-anchor="middle" fill="#7d9ea4" font-size="14">Companion App</text>
    <text x="316" y="66" text-anchor="middle" fill="#22383d" font-size="11.5">10 values, 5 Modulinos</text>

    <path d="M104 84v26h106M316 84v26H210M210 110v18" fill="none" stroke="#22383d" stroke-width="1.5"/>

    <rect x="110" y="130" width="200" height="44" rx="9" fill="#1b2b2f" stroke="#22383d" stroke-width="2"/>
    <text x="210" y="157" text-anchor="middle" fill="#e6f1f2" font-size="14">one brick</text>

    <path d="M210 176v16" fill="none" stroke="#22383d" stroke-width="1.5"/>

    <rect x="110" y="192" width="200" height="44" rx="9" fill="#1b2b2f" stroke="#22383d" stroke-width="2"/>
    <text x="210" y="219" text-anchor="middle" fill="#e6f1f2" font-size="14">one firmware, never reflashed</text>
  </g>
</svg>

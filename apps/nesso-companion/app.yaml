name: Nesso N1 Companion
description: Pairs an Arduino Nesso N1 with the UNO Q over WebSocket and shows everything it streams - IMU, buttons, Modulino events and screen widgets - on a live Web UI.
icon: 📲
ports:
  - 8077
bricks:
  - arduino:web_ui: {}
  - nesso_companion:
      variables:
        NESSO_PORT: "8077"
        NESSO_NAME: "Nesso N1 Companion"
        NESSO_DEFAULT_RATE_HZ: "10"
        # Check an attached Nesso against nesso-firmware/build at start-up and
        # update it if it differs. OFF unless you mean it: probing resets
        # whatever ESP32 is on the port, and the USB ids cannot tell a Nesso
        # from any other Espressif board.
        NESSO_AUTOFLASH: "false"

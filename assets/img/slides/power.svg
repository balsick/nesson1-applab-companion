<svg viewBox="0 0 420 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blanking the screen when idle, and projecting runtime from measured current">
  <!-- screen that blanks when idle -->
  <g>
    <rect x="16" y="42" width="76" height="118" rx="12" fill="#132023" stroke="#22383d" stroke-width="2"/>
    <rect x="25" y="52" width="58" height="82" rx="5" fill="#0c1416" stroke="#22383d"/>
    <g fill="#22383d"><rect x="33" y="62" width="34" height="5" rx="2.5"/><rect x="33" y="74" width="42" height="4" rx="2"/></g>

    <path d="M100 101h30" stroke="#22383d" stroke-width="1.5" stroke-dasharray="3 4"/>

    <rect x="138" y="42" width="76" height="118" rx="12" fill="#0c1416" stroke="#22383d" stroke-width="2"/>
    <rect x="147" y="52" width="58" height="82" rx="5" fill="#000" stroke="#1a2a2e"/>
    <text x="176" y="98" text-anchor="middle" fill="#1d3035" font-family="system-ui,sans-serif" font-size="10" letter-spacing="2">OFF</text>
  </g>
  <text x="115" y="186" text-anchor="middle" fill="#7d9ea4" font-family="system-ui,sans-serif" font-size="13">idle &#8594; dark &#8594; touch wakes it</text>
  <text x="115" y="206" text-anchor="middle" fill="#22383d" font-family="system-ui,sans-serif" font-size="11.5">the backlight is the biggest load</text>

  <line x1="238" y1="34" x2="238" y2="206" stroke="#22383d" stroke-dasharray="3 5"/>

  <!-- measured current, projected forward -->
  <g>
    <rect x="266" y="52" width="104" height="44" rx="6" fill="none" stroke="#7d9ea4" stroke-width="2"/>
    <rect x="378" y="64" width="7" height="20" rx="2" fill="#7d9ea4"/>
    <rect x="272" y="58" width="52" height="32" rx="3" fill="#4cc38a"/>
    <text x="318" y="122" text-anchor="middle" fill="#e6f1f2" font-family="ui-monospace,monospace" font-size="14">-128 mA</text>
    <text x="318" y="140" text-anchor="middle" fill="#22383d" font-family="system-ui,sans-serif" font-size="11.5">read from the gauge</text>

    <path d="M274 164h96" stroke="#22383d" stroke-width="1.5"/>
    <path d="M274 158 370 190" stroke="#37d6e0" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>
    <circle cx="370" cy="190" r="4.5" fill="#37d6e0"/>
    <text x="318" y="214" text-anchor="middle" fill="#37d6e0" font-family="system-ui,sans-serif" font-size="15">empty in 3 h 40</text>
  </g>
</svg>

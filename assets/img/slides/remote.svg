<svg viewBox="0 0 420 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Nesso N1: a large button on its face advances, a small one on its edge goes back">
  <!-- body -->
  <rect x="146" y="14" width="124" height="212" rx="20" fill="#132023" stroke="#22383d" stroke-width="2"/>

  <!-- screen -->
  <rect x="160" y="28" width="96" height="128" rx="7" fill="#0c1416" stroke="#22383d"/>
  <text x="208" y="52" text-anchor="middle" fill="#e6f1f2" font-family="system-ui,sans-serif" font-size="19" font-weight="600">5 / 8</text>
  <line x1="170" y1="64" x2="246" y2="64" stroke="#22383d"/>
  <text x="208" y="86" text-anchor="middle" fill="#37d6e0" font-family="system-ui,sans-serif" font-size="19" font-weight="600">4:12</text>
  <rect x="170" y="98" width="76" height="24" rx="5" fill="#1b2b2f"/>
  <text x="180" y="115" fill="#37d6e0" font-family="system-ui,sans-serif" font-size="15">&#8722;</text>
  <text x="208" y="115" text-anchor="middle" fill="#e6f1f2" font-family="system-ui,sans-serif" font-size="14">5</text>
  <text x="236" y="115" fill="#37d6e0" font-family="system-ui,sans-serif" font-size="15">+</text>
  <rect x="170" y="128" width="76" height="22" rx="5" fill="#1b2b2f"/>
  <text x="208" y="143" text-anchor="middle" fill="#7d9ea4" font-family="system-ui,sans-serif" font-size="11">Recentre</text>

  <!-- KEY1: the large button across the face -->
  <rect x="162" y="170" width="92" height="42" rx="13" fill="#1b2b2f" stroke="#00979d" stroke-width="2"/>
  <circle cx="208" cy="191" r="8" fill="#00979d" opacity=".45"/>

  <!-- KEY2: the small one on the edge -->
  <rect x="268" y="74" width="9" height="34" rx="4" fill="#1b2b2f" stroke="#22383d" stroke-width="1.5"/>

  <!-- callouts -->
  <path d="M158 191h-44" stroke="#22383d" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="106" y="187" text-anchor="end" fill="#e6f1f2" font-family="system-ui,sans-serif" font-size="15">KEY1</text>
  <text x="106" y="205" text-anchor="end" fill="#7d9ea4" font-family="system-ui,sans-serif" font-size="12.5">next &#183; on the face</text>

  <path d="M281 91h40" stroke="#22383d" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="328" y="87" fill="#e6f1f2" font-family="system-ui,sans-serif" font-size="15">KEY2</text>
  <text x="328" y="105" fill="#7d9ea4" font-family="system-ui,sans-serif" font-size="12.5">back &#183; on the edge</text>
</svg>

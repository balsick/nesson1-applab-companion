<svg viewBox="0 0 420 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tilting the Nesso moves the pointer; pitch and roll feed it">
  <!-- the slide being pointed at -->
  <rect x="172" y="30" width="236" height="142" rx="10" fill="#0d1a1d" stroke="#22383d" stroke-width="2"/>
  <g fill="#22383d"><rect x="192" y="54" width="118" height="9" rx="4.5"/><rect x="192" y="78" width="166" height="5" rx="2.5"/><rect x="192" y="92" width="136" height="5" rx="2.5"/></g>

  <path d="M96 148 316 112" stroke="#e8595b" stroke-width="2" stroke-dasharray="5 6" opacity=".5"/>
  <circle cx="316" cy="112" r="13" fill="#e8595b" opacity=".2"/>
  <circle cx="316" cy="112" r="6.5" fill="#e8595b"/>

  <g transform="rotate(-17 74 166)">
    <rect x="46" y="118" width="56" height="96" rx="12" fill="#132023" stroke="#22383d" stroke-width="2"/>
    <rect x="54" y="127" width="40" height="58" rx="4" fill="#0c1416" stroke="#22383d"/>
    <rect x="56" y="192" width="36" height="14" rx="5" fill="#1b2b2f" stroke="#00979d"/>
  </g>

  <!-- the two angles that drive it -->
  <g fill="none" stroke="#37d6e0" stroke-width="2" stroke-linecap="round">
    <path d="M30 124a32 32 0 0 1 22-17" marker-end="url(#c)"/>
  </g>
  <defs><marker id="c" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0l6 4L0 8z" fill="#37d6e0"/></marker></defs>
  <text x="22" y="196" fill="#37d6e0" font-family="ui-monospace,monospace" font-size="12">pitch</text>
  <text x="22" y="214" fill="#37d6e0" font-family="ui-monospace,monospace" font-size="12">roll</text>
  <text x="290" y="200" text-anchor="middle" fill="#7d9ea4" font-family="system-ui,sans-serif" font-size="13.5">no laser, no camera</text>
</svg>

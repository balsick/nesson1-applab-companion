id: nesso_companion
name: Nesso N1 Companion
description: |
  Turns an Arduino Nesso N1 into a companion device for this App.
  Opens a WebSocket server the Nesso connects to after discovering the board
  over mDNS. During the handshake the App tells the Nesso exactly which IMU
  values, button events, Modulino events and screen widgets it cares about, so
  the Nesso only powers up and streams what is actually used.
category: miscellaneous

ports:
  - 8077

variables:
  - name: NESSO_PORT
    description: "TCP port the companion WebSocket server listens on. 8077 is exposed by the 'ports' entry above; to move it, also add the new port to the App's app.yaml 'ports:'."
    default_value: "8077"
  - name: NESSO_NAME
    description: "Name advertised to the Nesso during the handshake and shown on its screen."
    default_value: "Nesso Companion"
  - name: NESSO_DEFAULT_RATE_HZ
    description: "Default streaming rate (Hz) requested for sensors registered without an explicit rate_hz."
    default_value: "10"

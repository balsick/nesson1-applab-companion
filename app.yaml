name: Nesso N1 Companion
description: "Pairs an Arduino Nesso N1 with the UNO Q over WebSocket and shows everything it streams - IMU, buttons, Modulino events and screen widgets - on a live Web UI."
ports: []
bricks:
- arduino:web_ui: {}
- nesso_companion:
    variables:
      NESSO_AUTOFLASH: "false"
      NESSO_DEFAULT_RATE_HZ: "10"
      NESSO_NAME: Nesso N1 Companion
      NESSO_PORT: "8077"
icon: 📲
